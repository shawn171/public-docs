name: Update HTML on File Upload

on:
  push:
    branches:
      - main
    paths:
      - 'uploads/**'

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update index.html with uploaded files
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import re

          html_path = Path("index.html")
          if not html_path.exists():
              raise SystemExit("index.html not found")

          files = sorted(
              p.relative_to(".").as_posix()
              for p in Path("uploads").rglob("*")
              if p.is_file()
          )
          items = "\n".join(f'<li><a href="{f}">{Path(f).name}</a></li>' for f in files)
          block = f"<!-- AUTO-LIST:START -->\n<ul>\n{items}\n</ul>\n<!-- AUTO-LIST:END -->"

          content = html_path.read_text(encoding="utf-8")
          pattern = re.compile(r"<!-- AUTO-LIST:START -->.*?<!-- AUTO-LIST:END -->", re.DOTALL)
          if not pattern.search(content):
              raise SystemExit("Markers not found in index.html")

          updated = pattern.sub(block, content)
          html_path.write_text(updated, encoding="utf-8")
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No HTML changes to commit."
          else
            git commit -m "chore: update index.html from uploaded files"
            git push
          fi
