name: Sync EU DoC JSON and Index

on:
  push:
    branches:
      - main
    paths:
      - 'doc/eu-doc-red/*.pdf'
      - 'scripts/sync_eu_doc.py'

permissions:
  contents: write

jobs:
  sync-eu-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pypdf
        run: python -m pip install pypdf

      - name: Parse PDFs to JSON and update index.html
        run: |
          python scripts/sync_eu_doc.py \
            --doc-dir doc/eu-doc-red \
            --json-out data/eu_doc_records.json \
            --index-html doc/eu-doc-red/index.html \
            --cache-file data/.eu_doc_parse_cache.json \
            --web-doc-dir doc/eu-doc-red

      - name: Commit and push updated PDFs, JSON, cache and index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/eu_doc_records.json data/.eu_doc_parse_cache.json doc/eu-doc-red/index.html
          if compgen -G "doc/eu-doc-red/*.pdf" > /dev/null; then
            git add doc/eu-doc-red/*.pdf
          fi

          if ! git diff --staged --quiet; then
            git commit -m "chore(eu-doc): split multi-model PDFs and sync index"
            git push
          fi
